name: Mobile screenshot regression

on: [push]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: Mobile-Agent-v3.5/mobile_use
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install numpy pillow openai
      - name: Run mobile tests
        working-directory: Mobile-Agent-v3.5/mobile_use
        run: python -m unittest test_screenshot test_parse_action -v
